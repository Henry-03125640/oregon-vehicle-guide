services:
  - type: web
    name: oregon-vehicle-guide
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: REQUIRE_PRIVATE_ACCESS
        value: "true"
      - key: PRIVATE_SITE_USERNAME
        value: owner
      - key: PRIVATE_SITE_PASSWORD
        sync: false
